[package]
name = "desktop-things"
version = "0.2.0"
edition = "2024"
authors = [
  "GamingLiamStudios <58615717+GamingLiamStudios@users.noreply.github.com>",
]


[[bin]]
name = "taskbar"
path = "src/taskbar.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"

thiserror = "2.0"

bytemuck = "1.24"
futures-lite = "2.6"

chrono = "0.4"

smithay-client-toolkit = "0.20"
wayland-protocols = "0.32"

wayland-scanner = "0.31"
wayland-backend = { version = "*", features = ["client_system"] }

pollster = "0.4"

egui = "0.33"
egui-wgpu = "*"


[lints.clippy]
all = "deny"
enum_glob_use = "deny"
nursery = "deny"
pedantic = "deny"
perf = "deny"
unwrap_used = "deny"

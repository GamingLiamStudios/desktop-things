[package]
name = "desktop-things"
version = "0.1.0"
edition = "2021"
authors = [
    "GamingLiamStudios <58615717+GamingLiamStudios@users.noreply.github.com>",
]

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"

egui = "0.31"
egui-wgpu = "*"
egui_extras = { version = "*", features = ["all_loaders"] }

smithay-client-toolkit = "0.19"
wayland-backend = { version = "*", features = ["client_system"] }
wayland-scanner = "*"
wayland-client = "*"
smol = "2.0"

bytemuck = "1.21"

[lints.clippy]
enum_glob_use = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
perf = "deny"
all = "deny"
